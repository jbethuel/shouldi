<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Should I Apply? promo tile</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .tile { position: relative; overflow: hidden; color: #fff; background: radial-gradient(circle at 20% 15%, #3f8a75 0%, #2f6f5e 45%, #24574a 100%); }
      .small { width: 440px; height: 280px; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; gap: 14px; }
      .marquee { width: 1400px; height: 560px; }
      .mark { display: grid; place-items: center; background: #fff; border-radius: 22%; }
      .mark svg { width: 62%; height: 62%; }
      .small .mark { width: 64px; height: 64px; }
      .small h1 { margin: 0; font-size: 40px; letter-spacing: -0.02em; line-height: 1; }
      .small p { margin: 0; font-size: 18px; line-height: 1.35; opacity: 0.92; max-width: 330px; }
      .marquee .copy { position: absolute; left: 96px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
      .marquee .mark { width: 88px; height: 88px; }
      .marquee h1 { margin: 0; font-size: 64px; letter-spacing: -0.03em; line-height: 1; }
      .marquee p { margin: 0; font-size: 28px; line-height: 1.3; opacity: 0.92; }
      .marquee .popup { position: absolute; right: 120px; top: 56px; width: 360px; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35); transform: scale(1.12); transform-origin: top right; background: #fbfaf7; }
      .marquee iframe { display: block; width: 360px; height: 400px; border: 0; }
    </style>
  </head>
  <body>
    <div id="tile" class="tile"></div>
    <script>
      const CHECK = `<svg viewBox="0 0 100 100"><path d="M18 52 L40 74 L84 28" fill="none" stroke="#2f6f5e" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const tile = document.getElementById("tile");
      if (new URLSearchParams(location.search).get("size") === "marquee") {
        tile.classList.add("marquee");
        tile.innerHTML = `<div class="copy"><div class="mark">${CHECK}</div><h1>Should I Apply?</h1><p>See how your resume matches a job. Your resume is saved only on your computer.</p></div>
          <div class="popup"><iframe src="popup.html?scene=strong"></iframe></div>`;
        const frame = tile.querySelector("iframe");
        addEventListener("message", (e) => { if (typeof e.data?.shouldiHeight === "number") frame.style.height = `${e.data.shouldiHeight}px`; });
      } else {
        tile.classList.add("small");
        tile.innerHTML = `<div class="mark">${CHECK}</div><h1>Should I Apply?</h1><p>See how your resume matches a job.</p>`;
      }
    </script>
  </body>
</html>
