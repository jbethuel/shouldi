name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests only; nothing calls the real TypeSafe API.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload the extension build
        uses: actions/upload-artifact@v7
        with:
          name: shouldi-extension
          path: apps/extension/build/chrome-mv3
          if-no-files-found: error
